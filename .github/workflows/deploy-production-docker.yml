name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build and push production image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push production image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  deploy-production:
    name: Deploy to EC2 production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # ← pauses here for manual approval

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via EC2 Instance Connect
        run: |
          ssh-keygen -t rsa -f /tmp/ec2_key -N "" -q

          aws ec2-instance-connect send-ssh-public-key \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/ec2_key.pub \
            --region ${{ env.AWS_REGION }}

          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -i /tmp/ec2_key \
              ec2-user@$EC2_IP << 'ENDSSH'
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              ${{ env.ECR_REGISTRY }}

            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

            docker stop tictactoe-prod 2>/dev/null || true
            docker rm tictactoe-prod 2>/dev/null || true

            docker run -d \
              --name tictactoe-prod \
              -p 3000:80 \
              --restart unless-stopped \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

            echo "Production deployed successfully"
            docker ps
          ENDSSH

          rm -f /tmp/ec2_key /tmp/ec2_key.pub
